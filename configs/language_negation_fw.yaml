# Language Negation Discovery - FineWeb-Medium (TUTORIAL EXAMPLE)
# 
# This is the TUTORIAL example from tutorials/2_language.ipynb, NOT the paper's Figure 8.
# The paper's Figure 8 uses ts-medium (features 1882/1179).
# This fw-medium example shows the SAME technique on a larger, clearer model.
#
# VERIFIED (2026-01-14): Paper's Figure 8 is ts-medium, this is tutorial demonstration
#
# From tutorials/2_language.ipynb:
#   model = Transformer.from_pretrained("tdooms/fw-medium")  # 16L, 335M params, FineWeb
#   tracer = Tracer(model, layer=7, inp=dict(expansion=8), out=dict(expansion=8))
#   out_vis(3834, 751, dark=True)  # Tutorial negation features
#
# Features: 3834 (not+negative: "not lost", "no interference")
#           751 (not+positive: "not free", "little relief")

name: language_negation_fw_medium
experiment_id: L5.1_TUTORIAL

model:
  pretrained: "tdooms/fw-medium"  # 16 layers, ~300M params, trained on FineWeb-EDU

sae:
  use_pretrained: true
  layer: 7           # Paper uses layer 7 (middle of 16-layer model)
  # Keep flat fields for backward compatibility in scripts that read `point/expansion/k`.
  point: "mlp-out"
  expansion: 8       # Paper uses expansion 8
  k: 30
  # Figure 8 requires BOTH input and output SAEs (Tracer uses both).
  input:
    name: "mlp-in"
    expansion: 8
    k: 30
  output:
    name: "mlp-out"
    expansion: 8
    k: 30

analysis:
  n_samples: 50000   # Number of text samples to analyze
  top_k: 20          # Number of top features to report
  
  # Tutorial example features (analogous to paper's 1882/1179)
  expected_not_good_feature: 3834   # "not + negative words"
  expected_not_bad_feature: 751     # "not + positive words"
  
  # For Figure 8 visualization (tutorial version)
  figure_8_feature: 3834  # Primary feature for detailed analysis

# Expected properties (both paper and tutorial):
# - Negative cosine similarity (opposing directions)
# - Form a linear subspace
# - Low-rank interaction matrices
