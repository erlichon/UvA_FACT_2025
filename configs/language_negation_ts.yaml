name: language_negation_ts
experiment_id: L5.1_PAPER

# Paper Section 5.1: Sentiment Negation Circuit
# "...for a 6-layer bilinear transformer trained on TinyStories"
#
# IMPORTANT: Paper used layer 4 with internal SAE checkpoints.
# HuggingFace only has both mlp-in and mlp-out SAEs for layer 5.
# Layer 5 is at 5/6 = 83% depth (slightly later than paper's 4/6 = 67%)
#
# ts-medium: 6 layers, 512d_model, 29.4M params, TinyStories dataset
# TinyStories produces cleaner semantic clustering than FineWeb-EDU

model:
  pretrained: "tdooms/ts-medium"

sae:
  # Use layer 5 - the ONLY layer with both mlp-in and mlp-out SAEs
  # Available on HuggingFace: 5-mlp-in-x4-k30, 5-mlp-out-x4-k30
  use_pretrained: true
  point: "mlp-out"
  layer: 5
  expansion: 4
  k: 30

analysis:
  # Number of samples to analyze for negation patterns
  n_samples: 50000
  # Number of top features to report
  top_k: 20
  
  # Note: Paper's features (1882/1179) are for layer 4.
  # Layer 5 features need to be discovered via search.
  # Run: ./scripts/train/run_language.sh figure8 search --model ts-medium
  
  # For Figure 8 visualization (will be updated after search)
  figure_8_feature: -1  # Placeholder - run search to discover
