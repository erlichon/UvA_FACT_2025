name: mnist_dense_high_energy
experiment_id: P1.HE

# High-Energy Initialization Experiment
# Tests the "Rich Training" regime hypothesis:
# - Standard init (init_scale=1.0) may keep model in "Lazy" regime (rank ~38)
# - High init (init_scale=5.0) should push into "Rich" regime (rank ~150+)
#
# The paper's "No Reg" baseline should have high rank (~150) before training
# and ONLY regularization should cause rank collapse.

model:
  mode: dense
  d_hidden: 256
  n_layer: 1
  init_scale: 5.0  # Push into Rich Training regime

training:
  epochs: 100
  lr: 0.001
  batch_size: 2048

regularization:
  noise_std: 0.0
  weight_decay: 0.0

data:
  dataset: mnist
