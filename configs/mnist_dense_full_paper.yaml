name: mnist_dense_full_paper
experiment_id: P1.4_paper

model:
  mode: dense
  d_hidden: 256
  n_layer: 1

training:
  epochs: 100
  lr: 0.001
  batch_size: 2048

# Paper Table 1 values (different from code defaults)
regularization:
  noise_std: 0.5   # Paper: 0.5 (code default/tutorial: 0.4)
  weight_decay: 1.0  # Paper: 1.0 (code default: 0.5)

data:
  dataset: mnist
