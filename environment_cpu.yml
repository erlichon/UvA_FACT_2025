name: fact_cpu
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.12.7
  - pip=24.2.0
  - pytest
  - pytorch>=2.5.0
  - torchvision
  - torchaudio
  - cpuonly
  - pip:
    - pytorch-lightning==2.4.0
    - tensorboard==2.17.1
    - tabulate>=0.9.0
    - tqdm>=4.66.5
    - pillow>=10.4.0
    - notebook>=7.2.2
    - jupyterlab>=4.2.5
    - matplotlib>=3.9.2
    - seaborn>=0.13.2
    - ipywidgets>=8.1.2
    # Project-specific dependencies
    - einops
    - jaxtyping
    - transformers
    - datasets
    - accelerate
    - wandb
    - codecarbon
    - kornia
    - nnsight>=0.5.0  # Requires 0.5.x API (Sight class updated)
    - bidict
    - pandas
    - plotly
    - gdown>=5.0.0  # Google Drive download for checkpoints/results
